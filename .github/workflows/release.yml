# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to publish a release
# with slide-poster-review.zip attached. The README links to the latest one:
# https://github.com/kussmaul/slide-poster-review/releases/latest/download/slide-poster-review.zip
name: Release skill zip

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the zip
        run: python tools/build_skill_zip.py dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/slide-poster-review.zip
          --title "slide-poster-review $GITHUB_REF_NAME" --generate-notes
